version: "3.8"

services:
  bot:
    build: .
    container_name: predictall-bot
    env_file: .env
    restart: unless-stopped
    # Optional: Mount volume for persistent SQLite database
    volumes:
      - ./data:/app/data
    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  data:
    driver: local
